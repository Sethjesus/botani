        let defaultChecked = {"3F-1650L乳化機": 548, "3F-1CP型攪拌機": 22, "3F-1軟管充填密封機": 228, "3F-1雙頭面膜充填機": 36, "4F-1凍乾機": 128, "4F-1半自動軟管充填密封機": 36, "4F-1手動充填機": 17, "4F-1打標機": 20, "4F-1真空乳化攪拌裝置50L": 159, "4F-1面膜袋封膜機": 40, "4F-2乾燥室": 79.2, "4F-2充填機": 17, "4F-2打標機": 20, "4F-2真空乳化攪拌裝置": 6.6159};
        let thresholdContainer = document.getElementById("threshold-container");
        let chartDiv = document.getElementById("chart");

        const colors = ['#FF5733', '#33FF57', '#5733FF', '#FFD700', '#FF33A1', '#A133FF', '#33A1FF', '#FF8C33', '#33FFA1', '#A1FF33'];

        for (let device in devices) {
            let isChecked = device in defaultChecked;
            let defaultThreshold = isChecked ? defaultChecked[device] : 1200;

            let deviceContainer = document.createElement("div");
            deviceContainer.classList.add("grid-item");
            deviceContainer.innerHTML = `
                <input type="checkbox" id="toggle-${device}" ${isChecked ? 'checked' : ''}>
                <label for="toggle-${device}">${device}</label>
                <input type="number" id="threshold-${device}" value="${defaultThreshold}" min="0" max="2000" step="0.1" oninput="syncSlider('${device}')">
                <input type="range" id="slider-${device}" value="${defaultThreshold}" min="0" max="2000" step="0.1" oninput="syncNumber('${device}')">
            `;
            thresholdContainer.appendChild(deviceContainer);
        }

        function syncSlider(device) {
            document.getElementById("slider-" + device).value = document.getElementById("threshold-" + device).value;
            updateChart();
        }

        function syncNumber(device) {
            document.getElementById("threshold-" + device).value = document.getElementById("slider-" + device).value;
            updateChart();
        }

        function updateChart() {
            let traces = [];
            let colorIndex = 0;

            for (let device in devices) {
                let checkbox = document.getElementById("toggle-" + device);
                let threshold = parseFloat(document.getElementById("threshold-" + device).value);

                if (checkbox.checked) {
                    let data = devices[device];

                    traces.push({
                        x: data.map(d => d["日期"]),
                        y: data.map(d => d["能耗 (kWh)"]),
                        mode: 'lines',
                        name: device,
                        line: { color: colors[colorIndex % colors.length], width: 3, shape: 'spline' }
                    });

                    traces.push({
                        x: data.map(d => d["日期"]),
                        y: Array(data.length).fill(threshold),
                        mode: 'lines',
                        name: device + " 警戒線",
                        line: { color: colors[colorIndex % colors.length], dash: 'dot', width: 2 }
                    });

                    colorIndex++;
                }
            }
            let layout = {
                title: '📈 每日設備能耗趨勢圖 (單位: kWh)',
                xaxis: { title: '📅 日期', tickangle: -45 },
                yaxis: { title: '🔋 用電量 (kWh)' },
                paper_bgcolor: '#ffffff',
                plot_bgcolor: '#eef2f7',
                font: { family: "Arial", size: 14, color: "#333333" },
            };
            Plotly.newPlot(chartDiv, traces, layout);
        }

        updateChart();
    </script>
