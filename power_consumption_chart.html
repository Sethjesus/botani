        } else if (label === '用電 (kWh)' || label === '碳排 (kgCO₂e)') {
          agingDiv.style.display = 'none';
        }
      } catch(err) {}
    });
  }

  // 初始狀態：顯示用電 (kWh)，所以先隱藏
  agingDiv.style.display = 'none';
})();

                        })                };                            </script>        </div>
